<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>低空物流地面站 · 感知界面原型</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root{
    --bg:#0b0e14; --panel:#12161f; --panel2:#171c27; --line:#242b38;
    --fg:#e6ebf3; --dim:#8b95a6; --dim2:#5b6577;
    --ok:#2f9e63; --warn:#d99a2b; --danger:#cf3b39; --idle:#4a5262;
  }
  body{
    background:var(--bg); color:var(--fg); height:100vh; overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    display:grid; grid-template-rows:56px 1fr;
  }

  /* ---------- 顶栏 ---------- */
  header{
    display:flex; align-items:center; gap:24px; padding:0 20px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .brand{ font-size:16px; font-weight:600; letter-spacing:.5px; }
  .brand span{ color:var(--dim); font-weight:400; font-size:13px; margin-left:10px; }
  .stat{ display:flex; gap:6px; align-items:baseline; font-size:13px; color:var(--dim); }
  .stat b{ font-size:17px; color:var(--fg); font-weight:600; }
  .alert-pill{
    margin-left:auto; display:flex; align-items:center; gap:8px;
    padding:7px 16px; border-radius:99px; font-size:13px; font-weight:600;
    background:rgba(207,59,57,.14); color:#f07774; border:1px solid rgba(207,59,57,.4);
  }
  .alert-pill.safe{ background:rgba(47,158,99,.12); color:#5cc98d; border-color:rgba(47,158,99,.35); }
  .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .clock{ font-variant-numeric:tabular-nums; color:var(--dim); font-size:13px; }

  /* ---------- 三栏 ---------- */
  main{ display:grid; grid-template-columns:268px 1fr 320px; overflow:hidden; }

  /* 左：机队 */
  .fleet{ background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; }
  .fleet h2{ font-size:11px; letter-spacing:1.6px; color:var(--dim2);
             padding:16px 16px 10px; font-weight:600; text-transform:uppercase; }
  .unit{
    display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
    padding:11px 16px; border-left:3px solid transparent; cursor:pointer;
    border-bottom:1px solid rgba(36,43,56,.6);
  }
  .unit:hover{ background:rgba(255,255,255,.03); }
  .unit.on{ background:rgba(74,144,217,.1); border-left-color:#4a90d9; }
  .unit .name{ font-size:13px; font-weight:600; }
  .unit .meta{ font-size:11px; color:var(--dim2); margin-top:3px; }
  .unit .val{ font-size:12px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; }
  .unit .val b{ display:block; font-size:15px; }
  .unit.danger .val b{ color:#f07774; }
  .unit.warn .val b{ color:#e0ab4a; }
  .unit.ok .val b{ color:#5cc98d; }
  .unit.idle{ opacity:.45; }

  /* 中：主视图 */
  .stage{ display:flex; flex-direction:column; padding:16px 18px; gap:12px; min-width:0; }
  .stage-head{ display:flex; align-items:center; gap:14px; }
  .stage-head .title{ font-size:15px; font-weight:600; }
  .stage-head .sub{ font-size:12px; color:var(--dim2); }
  .modes{ margin-left:auto; display:flex; gap:2px; background:var(--panel2);
          padding:3px; border-radius:8px; border:1px solid var(--line); }
  .modes button{
    border:0; background:transparent; color:var(--dim); font-size:12px; font-family:inherit;
    padding:7px 14px; border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .modes button.on{ background:#252c3b; color:var(--fg); font-weight:600; }

  .viewport{ position:relative; flex:1; min-height:0; background:#000; border-radius:10px;
             overflow:hidden; border:2px solid var(--line); transition:border-color .25s; }
  .viewport img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  .viewport.danger{ border-color:var(--danger); }
  .viewport.warn{ border-color:var(--warn); }
  .viewport.ok{ border-color:#2a3a2f; }
  .vbadge{
    position:absolute; left:14px; top:14px; padding:7px 14px; border-radius:7px;
    font-size:13px; font-weight:600; background:rgba(0,0,0,.72); backdrop-filter:blur(6px);
  }
  .timeline{ display:flex; gap:3px; align-items:flex-end; height:38px; }
  .timeline i{ flex:1; background:#2a3344; border-radius:2px; transition:background .2s; }
  .timeline i.hot{ background:#7a3030; }

  /* 右：详情 */
  .inspector{ background:var(--panel); border-left:1px solid var(--line);
              padding:18px; display:flex; flex-direction:column; gap:16px; overflow-y:auto; }
  .inspector h3{ font-size:11px; letter-spacing:1.6px; color:var(--dim2); font-weight:600; }
  .verdict{ font-size:26px; font-weight:700; line-height:1.25; }
  .verdict small{ display:block; font-size:12px; font-weight:400; color:var(--dim); margin-top:6px; }
  .kv{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0;
       border-bottom:1px solid rgba(36,43,56,.7); }
  .kv span{ color:var(--dim); }
  .kv b{ font-variant-numeric:tabular-nums; }
  .conf{ height:6px; background:#232a38; border-radius:3px; overflow:hidden; }
  .conf i{ display:block; height:100%; background:#4a90d9; }
  .actions{ display:grid; gap:8px; margin-top:auto; }
  .actions button{
    padding:11px; border-radius:8px; border:1px solid var(--line); background:var(--panel2);
    color:var(--fg); font-size:13px; font-family:inherit; cursor:pointer; font-weight:600;
  }
  .actions button:hover{ background:#1e2534; }
  .actions button.primary{ background:#8f2f2d; border-color:#b8433f; }
  .actions button.primary:hover{ background:#a53633; }
  .note{ font-size:11px; color:var(--dim2); line-height:1.6; }
</style>
</head>
<body>

<header>
  <div class="brand">低空物流地面站<span>Perception Console v0.1</span></div>
  <div class="stat">在线 <b id="s-online">12</b></div>
  <div class="stat">监控中 <b id="s-watch">12</b></div>
  <div class="stat">平均高度 <b id="s-alt">30</b> m</div>
  <div class="alert-pill" id="pill"><span class="dot"></span><span id="pill-t">全部安全</span></div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <aside class="fleet">
    <h2>机队状态</h2>
    <div id="list"></div>
  </aside>

  <section class="stage">
    <div class="stage-head">
      <div>
        <div class="title" id="u-title">UAV-01</div>
        <div class="sub" id="u-sub">楼宇间配送 · 航线 A3 · 高度 30 m</div>
      </div>
      <div class="modes">
        <button data-mode="A" class="on">A 原始画面</button>
        <button data-mode="B">B 分区着色</button>
        <button data-mode="C">C 结论式</button>
      </div>
    </div>
    <div class="viewport" id="vp">
      <img id="shot" alt="">
      <div class="vbadge" id="vbadge">—</div>
    </div>
    <div class="timeline" id="tl"></div>
  </section>

  <aside class="inspector">
    <div>
      <h3>系统判断</h3>
      <div class="verdict" id="verdict">—<small id="verdict-sub"></small></div>
    </div>
    <div>
      <h3>测量</h3>
      <div class="kv"><span>前方最近障碍</span><b id="m-dist">—</b></div>
      <div class="kv"><span>安全阈值</span><b>9.0 m</b></div>
      <div class="kv"><span>飞行速度</span><b id="m-spd">8.0 m/s</b></div>
      <div class="kv"><span>剩余电量</span><b id="m-bat">—</b></div>
    </div>
    <div>
      <h3>模型置信度</h3>
      <div class="conf"><i id="conf-bar" style="width:0"></i></div>
      <div class="note" id="conf-note" style="margin-top:8px">—</div>
    </div>
    <div class="actions">
      <button class="primary" id="btn-stop">立即悬停（H）</button>
      <button id="btn-slow">减速至 3 m/s</button>
      <button id="btn-replan">重规划航线</button>
    </div>
    <div class="note">原型演示：三种呈现模式共用同一份模型输出，切换只改变信息密度，不改变判据。</div>
  </aside>
</main>

<script>
const FRAMES = [{"pred": 2.23, "gt": 0.65, "truth": "danger"}, {"pred": 1.47, "gt": 0.68, "truth": "danger"}, {"pred": 1.44, "gt": 1.04, "truth": "danger"}, {"pred": 2.16, "gt": 1.28, "truth": "danger"}, {"pred": 1.56, "gt": 1.54, "truth": "danger"}, {"pred": 2.13, "gt": 1.97, "truth": "danger"}, {"pred": 1.67, "gt": 2.12, "truth": "danger"}, {"pred": 2.34, "gt": 2.64, "truth": "danger"}, {"pred": 2.34, "gt": 2.66, "truth": "danger"}, {"pred": 3.22, "gt": 3.25, "truth": "danger"}, {"pred": 65.57, "gt": 71.75, "truth": "safe"}, {"pred": 64.42, "gt": 71.75, "truth": "safe"}, {"pred": 65.22, "gt": 71.69, "truth": "safe"}, {"pred": 64.15, "gt": 71.69, "truth": "safe"}, {"pred": 64.68, "gt": 71.68, "truth": "safe"}, {"pred": 62.85, "gt": 71.31, "truth": "safe"}, {"pred": 65.17, "gt": 70.5, "truth": "safe"}, {"pred": 62.59, "gt": 70.0, "truth": "safe"}, {"pred": 64.64, "gt": 69.44, "truth": "safe"}, {"pred": 62.35, "gt": 68.94, "truth": "safe"}];

const MODE_NAME = {A:"原始画面", B:"分区着色", C:"结论式"};

let fleet = [], cur = 0, mode = "A";

function mkFleet(){
  const ids = [];
  for (let i = 1; i <= 12; i++) ids.push("UAV-" + String(i).padStart(2, "0"));
  const out = [];
  for (let i = 0; i < 12; i++){
    if (i < FRAMES.length){
      const f = FRAMES[i];
      out.push({ id: ids[i], hasFrame: true, idx: i, dist: f.pred,
                 gt: f.gt, bat: 38 + (i * 7) % 55, alt: 26 + (i * 3) % 12,
                 mode: f.pred < 9 ? "danger" : (f.pred < 18 ? "warn" : "ok") });
    } else {
      out.push({ id: ids[i], hasFrame: false, idx: -1, dist: null, gt: null,
                 bat: 40 + (i * 11) % 50, alt: 28, mode: "idle" });
    }
  }
  return out;
}

function level(d){ return d < 9 ? "danger" : (d < 18 ? "warn" : "ok"); }
const LV_TEXT = {danger:"危险", warn:"注意", ok:"安全", idle:"无画面"};

function renderList(){
  const el = document.getElementById("list");
  el.innerHTML = fleet.map((u, i) => `
    <div class="unit ${u.mode} ${i === cur ? "on" : ""}" data-i="${i}">
      <span class="dot" style="color:${u.mode==='danger'?'#cf3b39':u.mode==='warn'?'#d99a2b':u.mode==='ok'?'#2f9e63':'#4a5262'}"></span>
      <div>
        <div class="name">${u.id}</div>
        <div class="meta">${u.hasFrame ? LV_TEXT[u.mode] + " · 电量 " + u.bat + "%" : "信号中断"}</div>
      </div>
      <div class="val"><b>${u.dist === null ? "—" : u.dist.toFixed(1)}</b>${u.dist === null ? "" : "m"}</div>
    </div>`).join("");
  el.querySelectorAll(".unit").forEach(n => n.onclick = () => {
    cur = +n.dataset.i; renderList(); renderStage(); renderInspector();
  });
}

function renderStage(){
  const u = fleet[cur];
  document.getElementById("u-title").textContent = u.id;
  document.getElementById("u-sub").textContent =
    u.hasFrame ? `楼宇间配送 · 航线 A${(cur % 5) + 1} · 高度 ${u.alt} m` : "信号中断，等待重连";
  const vp = document.getElementById("vp");
  const img = document.getElementById("shot");
  const badge = document.getElementById("vbadge");
  vp.className = "viewport " + u.mode;

  if (!u.hasFrame){
    img.removeAttribute("src");
    badge.textContent = "无画面";
    badge.style.color = "#8b95a6";
    return;
  }
  img.src = `stimuli/sq/f${String(u.idx).padStart(2,"0")}_${mode}.png`;
  if (mode === "C"){
    badge.textContent = LV_TEXT[u.mode] + " · 建议" + (u.mode === "danger" ? "立即悬停" : u.mode === "warn" ? "减速通过" : "维持速度");
  } else if (mode === "B"){
    badge.textContent = "风险分区 · 红近蓝远";
  } else {
    badge.textContent = "前视原始画面";
  }
  badge.style.color = u.mode === "danger" ? "#f07774" : u.mode === "warn" ? "#e0ab4a" : "#5cc98d";

  const tl = document.getElementById("tl");
  tl.innerHTML = fleet.map((x, i) =>
    `<i class="${x.hasFrame && x.mode === 'danger' ? 'hot' : ''}" style="height:${x.hasFrame ? 30 + (x.bat % 8) * 2 : 8}%;opacity:${i === cur ? 1 : .45}"></i>`).join("");
}

function renderInspector(){
  const u = fleet[cur];
  const v = document.getElementById("verdict");
  const sub = document.getElementById("verdict-sub");
  if (!u.hasFrame){
    v.textContent = "无信号"; v.style.color = "#5b6577"; sub.textContent = "该机当前无可用画面";
    document.getElementById("m-dist").textContent = "—";
    document.getElementById("m-bat").textContent = u.bat + " %";
    document.getElementById("conf-bar").style.width = "0%";
    document.getElementById("conf-note").textContent = "—";
    return;
  }
  v.textContent = LV_TEXT[u.mode];
  v.style.color = u.mode === "danger" ? "#f07774" : u.mode === "warn" ? "#e0ab4a" : "#5cc98d";
  sub.textContent = u.mode === "danger" ? "前方障碍进入刹车区间" : u.mode === "warn" ? "前方有障碍，建议减速" : "前方通畅";
  document.getElementById("m-dist").textContent = u.dist.toFixed(1) + " m";
  document.getElementById("m-bat").textContent = u.bat + " %";

  // 置信度：距离越接近 9 米阈值，判断越不稳定
  const margin = Math.min(Math.abs(u.dist - 9) / 9, 1);
  const conf = Math.round(40 + margin * 55);
  document.getElementById("conf-bar").style.width = conf + "%";
  document.getElementById("conf-bar").style.background = conf > 70 ? "#4a90d9" : conf > 50 ? "#d99a2b" : "#cf3b39";
  document.getElementById("conf-note").textContent =
    conf > 70 ? "距离远离阈值，判断稳定" :
    conf > 50 ? "接近阈值，建议人工复核" :
    "紧贴阈值，此判断不可单独作为依据";
}

function renderHeader(){
  const bad = fleet.filter(u => u.hasFrame && u.mode === "danger").length;
  const pill = document.getElementById("pill");
  const t = document.getElementById("pill-t");
  document.getElementById("s-watch").textContent = fleet.filter(u => u.hasFrame).length;
  if (bad > 0){
    pill.className = "alert-pill";
    t.textContent = `${bad} 架进入刹车区间`;
  } else {
    pill.className = "alert-pill safe";
    t.textContent = "全部安全";
  }
}

document.querySelectorAll(".modes button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".modes button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); mode = b.dataset.mode; renderStage();
});
document.getElementById("btn-stop").onclick = () => {
  const u = fleet[cur]; if (!u.hasFrame) return;
  u.mode = "ok"; u.dist = Math.max(u.dist, 24); renderList(); renderStage(); renderInspector(); renderHeader();
};
document.getElementById("btn-slow").onclick = () => { document.getElementById("m-spd").textContent = "3.0 m/s"; };
document.getElementById("btn-replan").onclick = () => { document.getElementById("u-sub").textContent += " · 已提交重规划"; };

setInterval(() => {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("zh-CN", {hour12:false});
}, 1000);

fleet = mkFleet();
renderList(); renderStage(); renderInspector(); renderHeader();
</script>
</body>
</html>
