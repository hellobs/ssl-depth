<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SciFig 预览</title>
<style>
  :root { --fg:#1f2329; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f8fa; --accent:#0072B2; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:16px 20px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { margin:0 0 4px; font-size:18px; font-weight:600; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 20px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  button { font:inherit; font-size:13px; padding:7px 14px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; color:var(--fg); }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { opacity:.9; color:#fff; }
  .spacer { flex:1; }
  .dpi-label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; }
  .dpi-label select { font:inherit; font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:5px; color:var(--fg); }
  main { padding:20px; }
  #canvas-wrap { overflow:auto; background:#fff; border:1px solid var(--line); border-radius:8px; padding:24px; }
  #stage svg { display:block; margin:0 auto; }
  section.card { background:#fff; border:1px solid var(--line); border-radius:8px; margin-top:16px; overflow:hidden; }
  section.card > h2 { margin:0; padding:12px 16px; font-size:14px; font-weight:600; border-bottom:1px solid var(--line); background:#fafbfc; }
  #lint { padding:12px 16px; }
  #lint .ok { color:#009E73; font-weight:600; }
  #lint ul { margin:0; padding-left:20px; }
  #lint li { margin:4px 0; font-size:13px; }
  #lint li.error { color:#c62828; }
  #lint li.warning { color:#b26a00; }
  #lint li.info { color:var(--muted); }
  #dsl-text { width:100%; min-height:240px; border:none; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; padding:12px 16px; color:#333; background:#fff; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1f2329; color:#fff; padding:8px 16px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
  <header>
    <h1 id="title">SciFig 预览</h1>
    <p>这是自动生成的科研示意图草稿。满意可直接导出 PNG/TIFF 投稿；需精修点「去精修」在 draw.io 里改。</p>
  </header>

  <div class="toolbar">
    <button class="primary" id="btn-drawio">去精修 (draw.io)</button>
    <button id="btn-download-drawio">下载 .drawio</button>
    <button id="btn-copy-svg">复制 SVG</button>
    <button id="btn-download-svg">下载 SVG</button>
    <button id="btn-copy-dsl">复制 DSL</button>
    <span class="spacer"></span>
    <label class="dpi-label">DPI
      <select id="dpi-select">
        <option value="300">300</option>
        <option value="600" selected>600</option>
        <option value="1200">1200</option>
      </select>
    </label>
    <button id="btn-png">导出 PNG</button>
    <button id="btn-tiff">导出 TIFF</button>
  </div>

  <main>
    <div id="canvas-wrap"><div id="stage"></div></div>

    <section class="card">
      <h2>校验报告</h2>
      <div id="lint"></div>
    </section>

    <section class="card">
      <h2>DSL（唯一真源，可复制贴回给 AI 继续迭代）</h2>
      <textarea id="dsl-text" spellcheck="false" readonly></textarea>
    </section>
  </main>

  <div id="toast"></div>

<script>
/* SciFig v1 —— 科研示意图渲染器（唯一真源 DSL → SVG）
 *
 * 架构铁律（见 DESIGN.md §2）：
 *   1. DSL(JSON) 是唯一真源，SVG / PNG / editor.html 均为渲染产物
 *   2. 本文件是唯一渲染器：浏览器编辑器与 Node CLI 调用同一份代码
 *   3. lint 也是本模块导出的纯函数，双端规则永远一致
 *
 * 零依赖。文字度量走预生成字宽查表（fontmetrics.json），
 * 不依赖运行环境字体 —— 这是双端布局一致性的根基。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SciFig = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------------- 常量 ----------------
  var SCHEMA = 'scifig/v1';
  var VERSION = '1.0.0';
  var PX_PER_PT = 4 / 3;          // 96dpi 下 1pt = 4/3 px
  var LINE_H = 1.2;               // 行高（em 倍数）
  var FONT_MIN = 5, FONT_MAX = 8; // lint 硬边界（pt）
  var STROKE_MIN = 0.5;           // lint 硬边界（pt）

  // Okabe-Ito 色盲安全调色板（黑白可辨），按语义角色映射
  var OKABE = {
    primary: '#0072B2', secondary: '#E69F00', accent: '#009E73',
    input: '#56B4E9', output: '#D55E00', muted: '#7F7F7F', flow: '#000000'
  };
  var ROLES = Object.keys(OKABE);
  var SHAPES = ['rect', 'round', 'circle', 'ellipse', 'diamond', 'hex', 'cylinder', 'parallelogram'];

  // 视觉风格（全局统一，与期刊尺寸预设解耦）
  var VIZ = {
    rectRadius: 2,             // 直角矩形默认圆角 px
    roundRatio: 0.22,          // 圆角矩形圆角比例
    groupFill: '#F4F6FA',      // 分组框填充
    groupStroke: '#A0A8B8',    // 分组框边框
    groupLabel: '#4A5568',     // 分组标题色
    feedbackStroke: '#8A94A6', // feedback/回折边
    arrowSize: 8,              // 箭头尺寸 px
    emphasize: ['input', 'output'] // 强调角色（深填充 + 粗描边 + 加粗文字）
  };
  var EDGE_KINDS = ['arrow', 'line', 'dashed', 'double'];
  var ROUTINGS = ['ortho', 'poly', 'straight'];
  var ALIGNS = ['left', 'center', 'right'];

  var METRICS = null, PRESETS = null;

  function init(cfg) {
    if (cfg && cfg.metrics) METRICS = cfg.metrics;
    if (cfg && cfg.presets) PRESETS = cfg.presets;
    return { metrics: !!METRICS, presets: !!PRESETS };
  }

  function unitPx(unit) {
    if (unit === 'mm') return 96 / 25.4;
    if (unit === 'in') return 96;
    return 1; // px
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function fmt(n) { return Math.round(n * 100) / 100; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 颜色向白色混合（浅色填充）：f 为混白比例
  function lighten(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r + (255 - r) * f); g = Math.round(g + (255 - g) * f); b = Math.round(b + (255 - b) * f);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
  }

  // ---------------- 校验（白名单，未知属性拒绝） ----------------
  var TOP_KEYS = ['schema', 'meta', 'style', 'nodes', 'edges', 'groups', 'annotations'];
  var NODE_KEYS = ['id', 'shape', 'label', 'role', 'position', 'size'];
  var EDGE_KEYS = ['id', 'from', 'to', 'kind', 'label', 'labelPos', 'routing', 'feedback'];
  var GROUP_KEYS = ['id', 'members', 'label', 'style', 'padding'];
  var ANNO_KEYS = ['id', 'text', 'position', 'align', 'size'];

  function err(issues, element, msg) { issues.push({ rule: 'SCHEMA', severity: 'error', element: element, message: msg }); }

  function validate(dsl) {
    var issues = [];
    if (!dsl || typeof dsl !== 'object') { err(issues, '(root)', 'DSL 必须是对象'); return { pass: false, issues: issues }; }
    if (dsl.schema !== SCHEMA) err(issues, '(root)', 'schema 必须是 ' + SCHEMA);
    for (var k in dsl) if (TOP_KEYS.indexOf(k) < 0) err(issues, '(root)', '未知顶层字段: ' + k);

    var meta = dsl.meta || {};
    if (meta.direction && ['TB', 'LR'].indexOf(meta.direction) < 0) err(issues, 'meta', 'direction 只允许 TB | LR');
    if (PRESETS && meta.preset && !PRESETS[meta.preset]) err(issues, 'meta', '未知预设: ' + meta.preset + '（可用: ' + Object.keys(PRESETS).join(', ') + '）');

    var st = dsl.style || {};
    if (st.palette && st.palette !== 'okabe-ito') err(issues, 'style', 'palette 只支持 okabe-ito');
    if (st.strokeWidth != null && (typeof st.strokeWidth !== 'number' || st.strokeWidth <= 0)) err(issues, 'style', 'strokeWidth 必须是正数');
    if (st.fontSize) {
      if (st.fontSize.body != null && typeof st.fontSize.body !== 'number') err(issues, 'style', 'fontSize.body 必须是数字');
      if (st.fontSize.small != null && typeof st.fontSize.small !== 'number') err(issues, 'style', 'fontSize.small 必须是数字');
    }

    if (!Array.isArray(dsl.nodes) || dsl.nodes.length === 0) err(issues, 'nodes', 'nodes 必须是非空数组');

    var ids = {};
    (dsl.nodes || []).forEach(function (n, i) {
      var el = 'nodes[' + i + ']';
      if (!n || typeof n !== 'object') { err(issues, el, '必须是对象'); return; }
      for (var k in n) if (NODE_KEYS.indexOf(k) < 0) err(issues, el, '未知字段: ' + k);
      if (!n.id || typeof n.id !== 'string') err(issues, el, '缺少 id');
      else if (ids[n.id]) err(issues, el, 'id 重复: ' + n.id);
      else ids[n.id] = true;
      if (n.shape && SHAPES.indexOf(n.shape) < 0) err(issues, el, 'shape 只允许: ' + SHAPES.join(', '));
      if (n.role && ROLES.indexOf(n.role) < 0) err(issues, el, 'role 只允许: ' + ROLES.join(', '));
      if (n.position && (typeof n.position.x !== 'number' || typeof n.position.y !== 'number')) err(issues, el, 'position.x/y 必须是数字');
      if (n.size) {
        var bad = function (v) { return v !== 'auto' && typeof v !== 'number'; };
        if (bad(n.size.w) || bad(n.size.h) || (typeof n.size.w === 'number' && n.size.w <= 0) || (typeof n.size.h === 'number' && n.size.h <= 0))
          err(issues, el, 'size.w/h 只允许正数或 "auto"');
      }
    });

    (dsl.edges || []).forEach(function (e, i) {
      var el = 'edges[' + i + ']';
      if (!e || typeof e !== 'object') { err(issues, el, '必须是对象'); return; }
      for (var k in e) if (EDGE_KEYS.indexOf(k) < 0) err(issues, el, '未知字段: ' + k);
      if (!e.id || typeof e.id !== 'string') err(issues, el, '缺少 id');
      if (!ids[e.from]) err(issues, el, 'from 引用不存在的节点: ' + e.from);
      if (!ids[e.to]) err(issues, el, 'to 引用不存在的节点: ' + e.to);
      if (e.from === e.to) err(issues, el, '不允许自环');
      if (e.kind && EDGE_KINDS.indexOf(e.kind) < 0) err(issues, el, 'kind 只允许: ' + EDGE_KINDS.join(', '));
      if (e.routing && ROUTINGS.indexOf(e.routing) < 0) err(issues, el, 'routing 只允许: ' + ROUTINGS.join(', '));
      if (e.labelPos != null && (typeof e.labelPos !== 'number' || e.labelPos < 0 || e.labelPos > 1)) err(issues, el, 'labelPos 必须在 [0,1]');
    });

    (dsl.groups || []).forEach(function (g, i) {
      var el = 'groups[' + i + ']';
      if (!g || typeof g !== 'object') { err(issues, el, '必须是对象'); return; }
      for (var k in g) if (GROUP_KEYS.indexOf(k) < 0) err(issues, el, '未知字段: ' + k);
      if (!g.id || typeof g.id !== 'string') err(issues, el, '缺少 id');
      if (!Array.isArray(g.members) || g.members.length === 0) err(issues, el, 'members 必须是非空数组');
      (g.members || []).forEach(function (m) { if (!ids[m]) err(issues, el, 'member 引用不存在的节点: ' + m); });
    });

    (dsl.annotations || []).forEach(function (a, i) {
      var el = 'annotations[' + i + ']';
      if (!a || typeof a !== 'object') { err(issues, el, '必须是对象'); return; }
      for (var k in a) if (ANNO_KEYS.indexOf(k) < 0) err(issues, el, '未知字段: ' + k);
      if (a.text == null) err(issues, el, '缺少 text');
      if (a.align && ALIGNS.indexOf(a.align) < 0) err(issues, el, 'align 只允许: ' + ALIGNS.join(', '));
      if (a.size && ['small', 'body'].indexOf(a.size) < 0) err(issues, el, 'size 只允许 small | body');
    });

    return { pass: issues.length === 0, issues: issues };
  }

  // ---------------- 文字度量（查表，双端一致） ----------------
  var CJK_RANGES = [
    [0x2E80, 0x2EFF], [0x3000, 0x303F], [0x3040, 0x30FF], [0x31F0, 0x31FF],
    [0x3400, 0x4DBF], [0x4E00, 0x9FFF], [0xF900, 0xFAFF], [0xFF00, 0xFFEF],
    [0x20000, 0x2A6DF]
  ];

  function isCJK(cp) {
    for (var i = 0; i < CJK_RANGES.length; i++)
      if (cp >= CJK_RANGES[i][0] && cp <= CJK_RANGES[i][1]) return true;
    return false;
  }

  function charEm(cp) {
    if (isCJK(cp)) return METRICS ? METRICS.cjkAdvance : 1.0;
    if (!METRICS) return 0.55; // 未初始化时的粗略兜底（正常流程不会走到）
    var segs = METRICS.segments, lo = 0, hi = segs.length - 1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1, s = segs[mid];
      if (cp < s[0]) hi = mid - 1;
      else if (cp > s[1]) lo = mid + 1;
      else return s[2];
    }
    return METRICS.defaultAdvance;
  }

  // 度量一段文字：宽/高/行数（fontSize 单位 pt）
  function measure(text, fontPt) {
    var fs = fontPt * PX_PER_PT;
    var lines = String(text == null ? '' : text).split('\n');
    var w = 0;
    for (var i = 0; i < lines.length; i++) {
      var lw = 0, line = lines[i];
      for (var j = 0; j < line.length; j++) lw += charEm(line.codePointAt(j));
      if (lw > w) w = lw;
    }
    return { width: w * fs, height: lines.length * fs * LINE_H, lines: lines.length };
  }

  // ---------------- 布局 ----------------
  // 返回 { nodes, edges, groups, annotations, canvas, font, notes }
  // nodes/edges/groups 均含最终几何；canvas 为 px(96dpi)
  function layout(dsl, opt) {
    opt = opt || {};
    var presetName = dsl.meta && dsl.meta.preset && PRESETS && PRESETS[dsl.meta.preset] ? dsl.meta.preset : 'screen';
    var preset = PRESETS ? PRESETS[presetName] : null;
    if (!preset) throw new Error('预设未加载，请先 init({presets})');
    var dir = (dsl.meta && dsl.meta.direction) === 'TB' ? 'TB' : 'LR';
    var compact = !!opt.compact;
    var scale = opt.fontScale || 1;
    var notes = [];

    var bodyPt = scale * ((dsl.style && dsl.style.fontSize && dsl.style.fontSize.body != null) ? dsl.style.fontSize.body : preset.baseFont);
    var smallPt = (dsl.style && dsl.style.fontSize && dsl.style.fontSize.small != null) ? dsl.style.fontSize.small : preset.smallFont;
    var font = { body: bodyPt, small: smallPt };
    var padX = preset.nodePaddingX, padY = preset.nodePaddingY;
    var layerGap = compact ? preset.minLayerGap : preset.layerGap;
    var nodeGap = compact ? preset.minNodeGap : preset.nodeGap;
    var strokePt = (dsl.style && dsl.style.strokeWidth != null) ? dsl.style.strokeWidth : preset.stroke;

    // ---- 节点自然尺寸（auto = 文字度量 + padding）----
    var nodes = dsl.nodes.map(function (n) {
      var m = measure(n.label != null ? n.label : n.id, font.body);
      var w, h, sizePinned = false;
      if (n.size && typeof n.size.w === 'number') { w = n.size.w; sizePinned = true; } else w = m.width + 2 * padX;
      if (n.size && typeof n.size.h === 'number') { h = n.size.h; sizePinned = true; } else h = m.height + 2 * padY;
      // 异形节点需要更多内部余量
      if (n.shape === 'diamond') { w = Math.max(w, m.width * 1.6); h = Math.max(h, m.height * 1.5); }
      else if (n.shape === 'hex') { w = Math.max(w, m.width + h * 0.6); }
      else if (n.shape === 'cylinder') { h = Math.max(h, m.height + 2 * padY + h * 0.18); }
      if (n.shape === 'circle') { var d = Math.max(w, h); w = d; h = d; }
      return {
        id: n.id, shape: n.shape || 'rect', label: n.label != null ? n.label : n.id,
        role: n.role || 'primary', lw: m.width, lh: m.height,
        w: w, h: h, sizePinned: sizePinned,
        position: n.position || null, x: 0, y: 0, layer: 0
      };
    });
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });

    // ---- 边分类：feedback 不参与分层 ----
    var edges = (dsl.edges || []).map(function (e) {
      return {
        id: e.id, from: e.from, to: e.to, kind: e.kind || 'arrow',
        label: e.label || '', labelPos: (e.labelPos != null ? e.labelPos : 0.5),
        routing: e.routing || 'ortho', feedback: !!e.feedback, pts: []
      };
    });
    var normal = edges.filter(function (e) { return !e.feedback; });
    var feedback = edges.filter(function (e) { return e.feedback; });

    // ---- 分层（Kahn + longest-path；残留环自动降级为 feedback）----
    var layer = {};
    function runKahn(edgeList) {
      var indeg = {}; nodes.forEach(function (n) { indeg[n.id] = 0; });
      edgeList.forEach(function (e) { indeg[e.to]++; });
      var queue = nodes.filter(function (n) { return indeg[n.id] === 0; }).map(function (n) { return n.id; });
      var processed = {};
      var i = 0;
      while (i < queue.length) {
        var u = queue[i++]; processed[u] = true;
        edgeList.forEach(function (e) {
          if (e.from !== u) return;
          layer[e.to] = Math.max(layer[e.to] || 0, (layer[u] || 0) + 1);
          if (--indeg[e.to] === 0) queue.push(e.to);
        });
      }
      return processed;
    }
    var guard = 0;
    while (guard++ <= edges.length) {
      for (var k in layer) delete layer[k];
      nodes.forEach(function (n) { layer[n.id] = 0; });
      var processed = runKahn(normal);
      if (Object.keys(processed).length === nodes.length) break;
      // 存在环：环上节点全部未被 Kahn 处理，摘掉环内一条边重试
      var unproc = nodes.filter(function (n) { return !processed[n.id]; }).map(function (n) { return n.id; });
      var back = normal.find(function (e) { return unproc.indexOf(e.from) >= 0 && unproc.indexOf(e.to) >= 0; });
      if (!back) break; // 理论不可达，保底退出
      back.feedback = true; feedback.push(back);
      normal = normal.filter(function (e) { return e !== back; });
      notes.push('检测到环，边 ' + back.id + ' 已自动按 feedback 处理');
    }
    nodes.forEach(function (n) { n.layer = layer[n.id] || 0; });

    // ---- 层内排序：barycenter 启发式（4 轮，确定性稳定排序）----
    var nLayers = 0;
    nodes.forEach(function (n) { if (n.layer >= nLayers) nLayers = n.layer + 1; });
    var layers = [];
    for (var i = 0; i < nLayers; i++) layers.push([]);
    nodes.forEach(function (n) { layers[n.layer].push(n); });
    var pos = {}; // barycenter 参考位（layer 内下标）
    layers.forEach(function (L) { L.forEach(function (n, i) { pos[n.id] = i; }); });

    function bary(n, li) {
      var sum = 0, cnt = 0;
      normal.forEach(function (e) {
        if (e.from === n.id && byId[e.to] && byId[e.to].layer === li) { sum += pos[e.to]; cnt++; }
        if (e.to === n.id && byId[e.from] && byId[e.from].layer === li) { sum += pos[e.from]; cnt++; }
      });
      return cnt ? sum / cnt : pos[n.id];
    }
    for (var it = 0; it < 4; it++) {
      var down = (it % 2 === 0);
      var seq = down ? range(1, nLayers - 1) : rangeRev(nLayers - 2, 0);
      seq.forEach(function (li) {
        var barys = layers[li].map(function (n) { return { n: n, b: bary(n, down ? li - 1 : li + 1), i: pos[n.id] }; });
        barys.sort(function (a, b) { return a.b - b.b || a.i - b.i; });
        layers[li] = barys.map(function (o) { return o.n; });
        layers[li].forEach(function (n, i2) { pos[n.id] = i2; });
      });
    }

    // ---- 坐标：position = 绝对画布坐标；auto 节点 0 起分层，再整体平移 offX/offY ----
    var dims = layers.map(function (L) { var a = L.filter(function (n) { return !n.position; }); if (!a.length) return 0; return Math.max.apply(null, a.map(function (n) { return dir === 'LR' ? n.w : n.h; })); });

  // ---- 通用工具 ----
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2000);
  }
  function copyText(txt) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制到剪贴板'); }
      catch (e) { toast('复制失败，请手动选择复制'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast('已复制到剪贴板'); }, fallback);
    } else fallback();
  }
  function download(name, content, type) {
    var blob = new Blob([content], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function uint8ToBase64(bytes) {
    var bin = '';
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }
  function svgPhysicalSize(svgStr, dpi) {
    var wm = svgStr.match(/width="([\d.]+)(mm|in|px)"/);
    var vb = svgStr.match(/viewBox="[-\d.eE ]+ ([\d.]+) ([\d.]+)"/);
    var pw;
    if (wm && wm[2] === 'mm') pw = Math.round(parseFloat(wm[1]) / 25.4 * dpi);
    else if (wm && wm[2] === 'in') pw = Math.round(parseFloat(wm[1]) * dpi);
    else if (wm && wm[2] === 'px') pw = Math.round(parseFloat(wm[1]) / 96 * dpi);
    else if (vb) pw = Math.round(parseFloat(vb[1]) * dpi / 96);
    else pw = Math.round(8 * dpi);
    var ph = vb ? Math.round(parseFloat(vb[2]) * pw / parseFloat(vb[1])) : Math.round(pw * 0.75);
    return { w: pw, h: ph };
  }
  function rasterize(svgStr, dpi, cb) {
    var blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
      var size = svgPhysicalSize(svgStr, dpi);
      var canvas = document.createElement('canvas');
      canvas.width = size.w; canvas.height = size.h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size.w, size.h);
      ctx.drawImage(img, 0, 0, size.w, size.h);
      URL.revokeObjectURL(url);
      cb(canvas, ctx, size);
    };
    img.onerror = function () { URL.revokeObjectURL(url); toast('SVG 光栅化失败'); };
    img.src = url;
  }

  var baseName = ((dsl.meta && dsl.meta.title) || 'figure').replace(/[^\w\u4e00-\u9fa5-]+/g, '_');
  var svgFull = '<?xml version="1.0" encoding="UTF-8"?>\n' + svg;

  // ---- draw.io 精修 ----
  function drawioXml() { return SciFig.drawio(out.dsl, out.layout); }
  function downloadDrawio() { download(baseName + '.drawio', drawioXml(), 'application/xml'); }
  function openDrawio() {
    var xml = drawioXml();
    var encoded = encodeURIComponent(xml);
    var bytes = new TextEncoder().encode(encoded);
    if (typeof CompressionStream !== 'function') { downloadDrawio(); toast('浏览器不支持压缩，已改为下载 .drawio'); return; }
    var cs = new CompressionStream('deflate-raw');
    var stream = new Blob([bytes]).stream().pipeThrough(cs);
    new Response(stream).arrayBuffer().then(function (ab) {
      var b64 = uint8ToBase64(new Uint8Array(ab));
      var payload = encodeURIComponent(JSON.stringify({ type: 'xml', compressed: true, data: b64 }));
      window.open('https://app.diagrams.net/?grid=0&pv=0&border=10&edit=_blank#create=' + payload, '_blank');
    }, function () { downloadDrawio(); toast('压缩失败，已改为下载 .drawio'); });
  }

  // ---- 导出 PNG / TIFF ----
  function getDpi() { return parseInt(document.getElementById('dpi-select').value, 10) || 600; }
  function exportPNG() {
    var dpi = getDpi();
    rasterize(svgFull, dpi, function (canvas) {
      canvas.toBlob(function (blob) { download(baseName + '.png', blob, 'image/png'); }, 'image/png');
    });
  }
  function exportTIFF() {
    var dpi = getDpi();
    rasterize(svgFull, dpi, function (canvas, ctx, size) {
      var data = ctx.getImageData(0, 0, size.w, size.h).data;
      var buf = SciTiff.encodeTiff(size.w, size.h, data, { dpi: dpi });
      download(baseName + '.tif', buf, 'image/tiff');
    });
  }

  document.getElementById('btn-drawio').addEventListener('click', openDrawio);
  document.getElementById('btn-download-drawio').addEventListener('click', downloadDrawio);
  document.getElementById('btn-copy-svg').addEventListener('click', function () { copyText(svgFull); });
  document.getElementById('btn-download-svg').addEventListener('click', function () { download(baseName + '.svg', svgFull, 'image/svg+xml'); });
  document.getElementById('btn-copy-dsl').addEventListener('click', function () { copyText(JSON.stringify(dsl, null, 2)); });
  document.getElementById('btn-png').addEventListener('click', exportPNG);
  document.getElementById('btn-tiff').addEventListener('click', exportTIFF);
