<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SciPlot 预览</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f4f4; color: #222; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .meta { font-size: 12px; color: #888; margin-bottom: 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  button { font: inherit; font-size: 13px; padding: 7px 14px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; color: #222; }
  button:hover { border-color: #0072B2; color: #0072B2; }
  button.primary { background: #0072B2; border-color: #0072B2; color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  .spacer { flex: 1; }
  .dpi-label { font-size: 12px; color: #888; display: flex; align-items: center; gap: 4px; }
  .dpi-label select { font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 5px; }
  .figure { background: #fff; display: flex; justify-content: center; }
  .figure svg { max-width: 100%; height: auto; }
  details { margin-top: 16px; }
  summary { cursor: pointer; font-size: 13px; color: #555; }
  pre { background: #f6f8fa; border-radius: 6px; padding: 12px; font-size: 11px; overflow: auto; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1f2329; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title">SCI 统计图预览</h1>
    <div class="meta" id="meta"></div>
    <div class="toolbar">
      <span class="spacer"></span>
      <label class="dpi-label">DPI
        <select id="dpi-select">
          <option value="300">300</option>
          <option value="600" selected>600</option>
          <option value="1200">1200</option>
        </select>
      </label>
      <button class="primary" id="btn-png">导出 PNG</button>
      <button id="btn-tiff">导出 TIFF</button>
      <button id="btn-svg">下载 SVG</button>
    </div>
    <div class="figure" id="figure"></div>
    <details>
      <summary>查看 plot spec（JSON）</summary>
      <pre id="spec"></pre>
    </details>
  </div>
</div>
<div id="toast"></div>

/* SciTiff：极简 TIFF 编码器（纯 JS，零依赖，Node / 浏览器通用 UMD）
 *
 * 输入 RGBA 像素 + 宽高，输出 RGB + PackBits 无损压缩的 TIFF 字节流（little-endian）。
 * 供 sci-diagram / sci-statchart 的「导出 TIFF」共用——Node 侧用 @resvg/resvg-js 的
 * render().pixels 喂进来，浏览器侧用 canvas getImageData 喂进来。

 * 是期刊普遍接受的无损 TIFF（Photoshop/ImageMagick/预览均可打开）。

  function packBits(src) {

    while (i < n) {

        out[p++] = 257 - run;
        out[p++] = src[i];
        i += run;
      } else {
        var start = i, lit = 0;
        while (i < n && lit < 128) {
          if (i + 1 < n && src[i] === src[i + 1]) break;
          i++; lit++;

        out[p++] = lit - 1;
        for (var k = 0; k < lit; k++) out[p++] = src[start + k];
      }
    }
    return out.slice(0, p);
  }

  // width, height: 像素尺寸；rgba: Uint8Array，长度 width*height*4，逐像素 R,G,B,A
  // opts: { dpi: 600 }（写入 XResolution/YResolution）
  function encodeTiff(width, height, rgba, opts) {
    opts = opts || {};
    var dpi = opts.dpi || 600;
    var px = width * height;

    // RGBA -> RGB（白底合成，避免透明导致 TIFF 出现黑底）
    var rgb = new Uint8Array(px * 3);
    for (var i = 0, j = 0; i < px; i++, j += 3) {
      var r = rgba[i * 4], g = rgba[i * 4 + 1], b = rgba[i * 4 + 2], a = rgba[i * 4 + 3];
      if (a === 255) { rgb[j] = r; rgb[j + 1] = g; rgb[j + 2] = b; }
      else if (a === 0) { rgb[j] = 255; rgb[j + 1] = 255; rgb[j + 2] = 255; }
      else {
        var f = a / 255;
        rgb[j] = Math.round(r * f + 255 * (1 - f));
        rgb[j + 1] = Math.round(g * f + 255 * (1 - f));
        rgb[j + 2] = Math.round(b * f + 255 * (1 - f));
      }
    }

    // TIFF PackBits 规范：每一扫描行（row）独立压缩后按序拼接，不得跨行连续压。
    var rowBytes = width * 3;
    var packed = [];
    var packedTotal = 0;
    for (var y = 0; y < height; y++) {
      var pr = packBits(rgb.subarray(y * rowBytes, (y + 1) * rowBytes));
      packed.push(pr);
      packedTotal += pr.length;
    }

    var N = 12;                       // IFD 条目数
    var IFD_START = 8;                // 头 8 字节
    var IFD_LEN = 2 + N * 12 + 4;     // count + entries + nextIFD = 150
    var BPS_OFF = IFD_START + IFD_LEN;        // 158：BitsPerSample[8,8,8] 6 字节
    var XRES_OFF = BPS_OFF + 6;               // 164：XResolution 8 字节
    var YRES_OFF = XRES_OFF + 8;              // 172：YResolution 8 字节
    var STRIP_OFF = YRES_OFF + 8;             // 180：像素数据起点

    var total = STRIP_OFF + packedTotal;
    var buf = new Uint8Array(total);
    var dv = new DataView(buf.buffer);

    buf[0] = 0x49; buf[1] = 0x49;             // "II" 小端
    dv.setUint16(2, 42, true);
    dv.setUint32(4, IFD_START, true);

    dv.setUint16(IFD_START, N, true);
    var e = IFD_START + 2;
    function entry(tag, type, count, value) {
      dv.setUint16(e, tag, true);
      dv.setUint16(e + 2, type, true);
      dv.setUint32(e + 4, count, true);
      if (type === 3 && count === 1) dv.setUint16(e + 8, value, true);  // SHORT 内联
      else dv.setUint32(e + 8, value, true);                            // LONG 内联 / 偏移
      e += 12;
    }
    entry(256, 4, 1, width);          // ImageWidth
    entry(257, 4, 1, height);         // ImageLength
    entry(258, 3, 3, BPS_OFF);        // BitsPerSample = [8,8,8]
    entry(259, 3, 1, 32773);          // Compression = PackBits
    entry(262, 3, 1, 2);              // PhotometricInterpretation = RGB
    entry(273, 4, 1, STRIP_OFF);      // StripOffsets
    entry(277, 3, 1, 3);              // SamplesPerPixel = 3
    entry(278, 4, 1, height);         // RowsPerStrip
    entry(279, 4, 1, packedTotal);    // StripByteCounts
    entry(282, 5, 1, XRES_OFF);       // XResolution = dpi/1
    entry(283, 5, 1, YRES_OFF);       // YResolution = dpi/1
    entry(296, 3, 1, 2);              // ResolutionUnit = inch
    dv.setUint32(e, 0, true);         // next IFD = 0

    dv.setUint16(BPS_OFF, 8, true);
    dv.setUint16(BPS_OFF + 2, 8, true);
    dv.setUint16(BPS_OFF + 4, 8, true);
    dv.setUint32(XRES_OFF, dpi, true);
    dv.setUint32(XRES_OFF + 4, 1, true);
    dv.setUint32(YRES_OFF, dpi, true);
    dv.setUint32(YRES_OFF + 4, 1, true);

    var off = STRIP_OFF;
    for (var ri = 0; ri < packed.length; ri++) {
      buf.set(packed[ri], off);
      off += packed[ri].length;
    }
    return buf;
  }

  return { encodeTiff: encodeTiff, packBits: packBits };
});

    rasterize(svgStr, dpi, function (canvas, ctx, size) {
      var data = ctx.getImageData(0, 0, size.w, size.h).data;
      var buf = SciTiff.encodeTiff(size.w, size.h, data, { dpi: dpi });
      download(baseName + '.tif', buf, 'image/tiff');
    });
  }

  document.getElementById('btn-png').addEventListener('click', exportPNG);
  document.getElementById('btn-tiff').addEventListener('click', exportTIFF);
  document.getElementById('btn-svg').addEventListener('click', function () {
    download(baseName + '.svg', svgFull, 'image/svg+xml');
  });
})();
</script>
</body>
</html>
